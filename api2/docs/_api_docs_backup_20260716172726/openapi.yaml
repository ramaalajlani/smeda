paths:
  /register:
    post:
      operationId: post_api_register
      tags:
        - Authentication
      summary: "AuthController::register"
      description: "الحالة: فعال\nRate limit: 5 طلبات/دقيقة لكل IP"
      security:

      parameters:

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "required|string|max:255"
                email:
                  type: string
                  description: "required|email|max:255|unique:users,email"
                password:
                  type: string
                  description: "required|confirmed"
                account_type:
                  type: string
                  description: required
                device_name:
                  type: string
                  description: "nullable|string|max:255"
                role:
                  type: string
                  description: prohibited
                roles:
                  type: string
                  description: prohibited
                permissions:
                  type: string
                  description: prohibited
                entity_type:
                  type: string
                  description: prohibited
                training_center_id:
                  type: string
                  description: prohibited
                trainer_id:
                  type: string
                  description: prohibited
                trainee_id:
                  type: string
                  description: prohibited
                is_active:
                  type: string
                  description: prohibited
              required:
                - name
                - email
                - password
                - account_type
      responses:
        200:
          description: نجاح
        201:
          description: تم الإنشاء
        404:
          description: غير موجود
        422:
          description: خطأ تحقق Validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        429:
          description: تجاوز Rate Limit
        500:
          description: خطأ خادم
  /login:
    post:
      operationId: post_api_login
